name: Build PodsCharge APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack PodsCharge Android project
        run: |
          mkdir -p app/src/main/java/com/podscharge/app app/src/main/res/drawable app/src/main/assets

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PodsCharge"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.podscharge.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.podscharge.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1E293B"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="3.5"
                  android:pathData="M34,28h40c8.8,0 16,7.2 16,16v20c0,8.8 -7.2,16 -16,16H34c-8.8,0 -16,-7.2 -16,-16V44C18,35.2 25.2,28 34,28z" />
              <path
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="3"
                  android:pathData="M18,47h72" />
              <path
                  android:strokeColor="#F8FAFC"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:pathData="M45,47h18" />
              <path
                  android:fillColor="#22C55E"
                  android:pathData="M54,60a4,4 0 1,0 0,8a4,4 0 1,0 0,-8z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="true" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="PodsCharge"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/podscharge/app/MainActivity.java
          package com.podscharge.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanRecord;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int REQ_PERMISSIONS = 1001;
              private static final int REQ_ENABLE_BT = 1002;
              private static final int APPLE_COMPANY_ID = 0x004C;

              private WebView webView;
              private BluetoothAdapter bluetoothAdapter;
              private BluetoothLeScanner scanner;
              private boolean isScanning = false;
              private boolean pendingStartAfterPerm = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(0xFF090D16);
                  window.setNavigationBarColor(0xFF090D16);

                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  if (bm != null) {
                      bluetoothAdapter = bm.getAdapter();
                  }

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new BleBridge(), "AndroidBle");
                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              private String[] getRequiredPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN);
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT);
                  }
                  return perms.toArray(new String[0]);
              }

              private boolean hasAllPermissions() {
                  for (String perm : getRequiredPermissions()) {
                      if (checkSelfPermission(perm) != PackageManager.PERMISSION_GRANTED) {
                          return false;
                      }
                  }
                  return true;
              }

              private boolean isLocationEnabled() {
                  LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (lm == null) return false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      return lm.isLocationEnabled();
                  }
                  return lm.isProviderEnabled(LocationManager.GPS_PROVIDER)
                          || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
              }

              private void startBleScanInternal() {
                  if (!hasAllPermissions()) {
                      pendingStartAfterPerm = true;
                      requestPermissions(getRequiredPermissions(), REQ_PERMISSIONS);
                      return;
                  }

                  if (bluetoothAdapter == null) {
                      sendError("Bluetooth hardware not available.");
                      return;
                  }

                  if (!bluetoothAdapter.isEnabled()) {
                      try {
                          startActivityForResult(new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE), REQ_ENABLE_BT);
                      } catch (SecurityException e) {
                          sendError("Please turn on Bluetooth in your phone settings.");
                      }
                      sendError("Please turn on Bluetooth, then tap Check again.");
                      return;
                  }

                  if (!isLocationEnabled()) {
                      sendError("Please turn on Location (GPS) so Android allows BLE scanning.");
                      return;
                  }

                  scanner = bluetoothAdapter.getBluetoothLeScanner();
                  if (scanner == null) {
                      sendError("BLE scanner unavailable.");
                      return;
                  }

                  if (isScanning) {
                      stopBleScanInternal();
                  }

                  ScanSettings scanSettings = new ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build();

                  try {
                      scanner.startScan(null, scanSettings, scanCallback);
                      isScanning = true;
                      evalJs("window.onNativeBleStarted && window.onNativeBleStarted();");
                  } catch (SecurityException e) {
                      sendError("Bluetooth permission denied.");
                  }
              }

              private void stopBleScanInternal() {
                  if (scanner != null && isScanning) {
                      try {
                          scanner.stopScan(scanCallback);
                      } catch (SecurityException ignored) {
                      }
                  }
                  isScanning = false;
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override
                  public void onScanResult(int callbackType, ScanResult result) {
                      if (result == null) return;
                      ScanRecord record = result.getScanRecord();
                      if (record == null) return;

                      byte[] appleData = record.getManufacturerSpecificData(APPLE_COMPANY_ID);
                      if (appleData == null || appleData.length < 10) return;

                      StringBuilder hex = new StringBuilder(appleData.length * 2);
                      for (byte b : appleData) {
                          hex.append(String.format("%02x", b & 0xFF));
                      }

                      String address = "airpods";
                      try {
                          if (result.getDevice() != null && result.getDevice().getAddress() != null) {
                              address = result.getDevice().getAddress();
                          }
                      } catch (SecurityException ignored) {
                      }

                      final int rssi = result.getRssi();
                      final String js = "window.onNativeBlePacket && window.onNativeBlePacket("
                              + JSONObject.quote(address) + "," + rssi + "," + JSONObject.quote(hex.toString()) + ");";
                      evalJs(js);
                  }

                  @Override
                  public void onScanFailed(int errorCode) {
                      isScanning = false;
                      sendError("Android BLE scan error code: " + errorCode);
                  }
              };

              private void sendError(String message) {
                  evalJs("window.onNativeBleError && window.onNativeBleError(" + JSONObject.quote(message) + ");");
              }

              private void evalJs(final String script) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript(script, null);
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_PERMISSIONS && pendingStartAfterPerm) {
                      pendingStartAfterPerm = false;
                      if (hasAllPermissions()) {
                          startBleScanInternal();
                      } else {
                          sendError("Bluetooth & Location permissions are required to scan AirPods.");
                      }
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (isScanning) {
                      stopBleScanInternal();
                      evalJs("window.onNativeBleStopped && window.onNativeBleStopped();");
                  }
              }

              @Override
              protected void onDestroy() {
                  stopBleScanInternal();
                  super.onDestroy();
              }

              private class BleBridge {
                  @JavascriptInterface
                  public void startScan() {
                      runOnUiThread(MainActivity.this::startBleScanInternal);
                  }

                  @JavascriptInterface
                  public void stopScan() {
                      runOnUiThread(MainActivity.this::stopBleScanInternal);
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>PodsCharge</title>
            <style>
              :root {
                --bg: #090d16;
                --surface: #121826;
                --surface-2: #1a2234;
                --border: #243047;
                --text: #f8fafc;
                --muted: #94a3b8;
                --accent: #38bdf8;
                --green: #22c55e;
                --amber: #f59e0b;
                --red: #ef4444;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                padding: 18px 16px 28px;
                display: flex;
                justify-content: center;
              }
              .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
              header { display: flex; align-items: center; justify-content: space-between; }
              h1 { font-size: 1.25rem; font-weight: 700; }
              .pill {
                font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
                background: rgba(34, 197, 94, 0.14); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3);
              }
              .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
              .device-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
              .model-title { font-size: 1.08rem; font-weight: 700; }
              .signal { font-size: 0.76rem; color: var(--muted); }
              .pods-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
              .battery-tile {
                background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px;
                padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;
              }
              .case-tile {
                background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px;
                padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
              }
              .case-left { display: flex; align-items: center; gap: 12px; }
              .tile-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
              .pct { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
              .bar-track { width: 100%; height: 7px; border-radius: 999px; background: #0b101b; overflow: hidden; }
              .bar-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--accent); transition: width 0.25s ease; }
              .sub-status { font-size: 0.75rem; color: var(--muted); }
              .sub-status.charging { color: #86efac; font-weight: 600; }
              .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
              .chip {
                background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
                font-size: 0.75rem; padding: 6px 10px; border-radius: 999px; cursor: pointer;
              }
              .chip.active { border-color: var(--accent); color: var(--text); background: rgba(56, 189, 248, 0.14); }
              button.main-btn {
                width: 100%; padding: 15px; border-radius: 14px; border: none;
                font-size: 1rem; font-weight: 700; cursor: pointer; background: var(--accent); color: #06283d;
              }
              button.main-btn.scanning {
                background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4);
              }
              button.sub-btn {
                width: 100%; padding: 11px; border-radius: 12px; background: var(--surface);
                border: 1px solid var(--border); color: var(--text); font-size: 0.85rem; font-weight: 600; cursor: pointer;
              }
              .status-line { text-align: center; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
            </style>
          </head>
 